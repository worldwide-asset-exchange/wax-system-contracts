# Non-sensitive report metadata: everything the findings JSON does not carry.
id: WCAP-SYS-2026-09
title: WAX System Contracts — Security Assessment
client: Worldwide Asset eXchange (WAX)
date: 2026-09-29
scope:
  repo: worldwide-asset-exchange/wax-system-contracts
  commit: 715ddba (audited) → d60af8c deployed; guilds.oig 5a5f198 deployed
  tag: wax-3.3.0 audited; wax-3.3.3 deployed 2026-09-28; guilds.oig 5a5f198 deployed 2026-09-29
  build_image: waxteam/waxdev:v5.0.3wax02-v4.1.0
scores:                       # Scorecard v7 (2026-09-29); keep in step with the Confluence scorecard
  - dimension: Security
    score: 9.2
    weight: 35
    basis: >-
      27 findings, 24 fixed on chain and independently re-verified; the three open are a process
      finding and two accepted informational items. No attacker-reachable path to fund loss or chain
      halt. Held under 10 by the single-key accounts behind the OIG multisigs and by this being a
      self-assessment.
  - dimension: Supply chain & reproducibility
    score: 9.8
    weight: 15
    basis: >-
      All five deployed contracts reproduce bit for bit from named sources and toolchains, and both
      September deploys were verified against the reproducible build. Three reproductions rest on
      2019–2020 toolchains.
  - dimension: Governance & upgrade safety
    score: 8.2
    weight: 15
    basis: >-
      Two upgrades ran exactly as generated by the deploy tooling under a 2-of-3 multisig; the guilds
      runbook completed to its last step; oig@owner is a 2-of-4 with no standalone key. No timelock on
      consensus-affecting parameters; the OIG seat accounts and deploy permissions are single-key.
  - dimension: Test coverage
    score: 8.0
    weight: 15
    basis: >-
      224 public cases; 88% of the contract's check() failure branches asserted by a test; a
      regression test per fixed finding; the 500-candidate election cost measured. Line and branch
      coverage cannot be instrumented in this toolchain, and the guilds repository has no tests of
      its own.
  - dimension: Code quality
    score: 8.0
    weight: 10
    basis: >-
      The validation/message defect class is closed at every instance and guarded by CI ratchets;
      the static baseline is six reasoned acceptances. Three residuals are stated rather than fixed
      (a stored-but-unread field, a running accumulator kept for off-chain readers, an accrual
      ceiling not re-checked).
  - dimension: Documentation
    score: 8.0
    weight: 10
    basis: >-
      A public architecture overview of the WAX-specific subsystems, a security policy with a
      disclosure process, deployed-source provenance and deploy runbooks are in the repository. The
      audit's private artefacts are documented by pointer only.

# How the scores are read. Judgements, not measurements; each basis names what holds the score.
rubric:
  - {band: "9.0–10", meaning: "No material deficiency; any residual is stated, bounded and outside the reviewed code's control."}
  - {band: "8.0–8.9", meaning: "Deficiencies found were fixed, deployed and independently verified; what remains is hygiene or a design choice deferred with reasons."}
  - {band: "7.0–7.9", meaning: "At least one material item open or unverified, or a structural gap that limits what can be claimed."}
  - {band: "5.0–6.9", meaning: "Open findings that bear on funds, consensus membership or custody, or a surface not reviewed."}
  - {band: "below 5", meaning: "Unreviewed, not reproducible, or an open High."}

# What was done, and how deep. Phase numbering follows WCAP v1 (Confluence BP/1552646145).
method:
  window: 2026-09-16 to 2026-09-29
  summary: >-
    A delta-first review of the WAX system contracts and the external guilds.oig contract whose table
    orders the producer schedule, run under the WAX Contract Audit Protocol (WCAP v1): reproduce the
    deployed code first, model the threats, sweep with type-aware static rules, review by hand where
    WAX diverges from upstream, prove the invariants with tests, then have a separate session
    re-verify every fix against the pre-fix and fixed binaries before and after deployment.
  phases:
    - {phase: "0 — Freeze & reproduce", what: "Reproducible build of the audited commit in the pinned image compared with the on-chain code hash of every deployed contract; the four older contracts traced to their own sources and toolchains."}
    - {phase: "1 — Threat model", what: "Assets, actors, trust boundaries and seven invariants (I1–I7) stated before reading code; the small producer set measured on chain and used as the severity input it is."}
    - {phase: "2 — Automated sweep", what: "Type-aware static rules over the WCAP taxonomy (authorization, arithmetic, resources, upgrade, cross-contract), calibrated for precision, run in CI as a ratchet that may only shrink."}
    - {phase: "3 — Manual review, delta-first", what: "Every WAX-only file and every heavily modified fork read line by line, every privileged setter individually; files byte-identical to upstream given a differential read only; the guilds contract read at full depth at two commits."}
    - {phase: "4 — Invariant & property testing", what: "Conservation, no double claim, solvency, authority monotonicity and bounded election cost tested in the public suite, including a property test and live-snapshot replays; guard-branch coverage measured by message."}
    - {phase: "5 — Report & triage", what: "Every finding recorded in a schema with impact × likelihood checked by the renderer; dismissed candidates recorded with their reasoning."}
    - {phase: "6 — Remediate & re-verify", what: "Each fix landed with a regression test; a session that did not write the fix ran it against the pre-fix contract (fail, at a recorded line) and the fixed one (pass), and read the fix for class versus symptom."}
    - {phase: "7 — Continuous", what: "Deploys generated from live chain state and verified by hash afterwards; the code-hash check, the static ratchet and the coverage figure run on every build."}
  depth:
    - {surface: "WAX-only code (worker proposals, standby pay, RNG carve-out, election weighting, guilds boundary)", how: "full manual review"}
    - {surface: "Forked files with large deltas (voting, producer pay, bandwidth, system setters)", how: "full manual review of the delta and its callers"}
    - {surface: "Files byte-identical to upstream (token, msig, wrap, exchange state, native, name bidding, limit-auth)", how: "differential only; deployed binaries reproduced"}
    - {surface: "guilds.oig (external repository)", how: "full manual review at two commits; auth-matrix tests against the deployed wasm by hash"}
  limits: >-
    Time-boxed and internal: it is not a third-party attestation. No formal verification and no
    fuzzing of the virtual machine; nodeos itself, the ORNG contract behind its interface and any
    off-chain service were out of scope. Line and branch coverage cannot be instrumented in the
    contract toolchain, so coverage is stated per validation branch. The absence of a finding is not
    a statement that none exists.
